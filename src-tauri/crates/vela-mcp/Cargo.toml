[package]
name = "vela-mcp"
description = "MCP client — stdio and HTTP transports, JSON-RPC peer, connection pool and notification-invalidated tool cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# NO HTTP CLIENT AND NO ASYNC RUNTIME, and both absences are load-bearing.
#
# The HTTP client: `vela-settings/tests/capability_matrix_endpoints.rs` asserts
# against the tree that exactly one crate in this workspace declares one, and
# that it is `vela-providers`. This crate's HTTP transport reaches the network
# through `exchange::HttpExchange`, a trait the composition root implements. A
# `reqwest` line here would turn that gate red, which is the gate doing its job:
# a second client would be a second redirect policy, a second proxy posture and
# a second idea of what a credential header is.
#
# The runtime: the stdio transport is two pipes and a child process, which the
# standard library already owns. Everything in this crate is synchronous, so an
# async seam for one of its two transports would put a runtime boundary in the
# middle of one crate and charge every caller for it.
#
# `vela-secrets` for the same reason in the other direction: the OS keychain is
# reachable from that crate and nowhere else, so a token here moves through the
# `SecretStore` trait rather than through `keyring`.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vela-core.workspace = true
vela-secrets.workspace = true
# One call site: `oauth::TokenSet::to_secret` builds a JSON string holding both
# tokens in plain text, and a `String` dropped normally leaves them in freed
# heap for the life of the process. `SecretValue` does this for itself; that
# buffer is the only credential material in this crate that lives outside one.
zeroize = "1"
