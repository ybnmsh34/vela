[package]
name = "vela-providers"
description = "Model-provider seam — the trait every backend (local or hosted) implements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vela-core.workspace = true
# The credential seam. This crate resolves an `Auth` binding into request
# material through `vela_secrets::resolve_auth`; it never touches the OS
# keychain, and never sees a `SecretValue` it did not ask that function for.
vela-secrets.workspace = true
async-trait = "0.1"
# `time` for the stall timeout that MEASURED-1 makes mandatory, `sync` for the
# cancellation token. No `rt`: the runtime belongs to the host process.
tokio = { version = "1", features = ["time", "sync", "macros"] }
# THE ONLY HTTP CLIENT IN THE WORKSPACE, and it lives here on purpose: the mock
# matrix proved the endpoints send no CORS headers and answer OPTIONS with 405,
# so a browser-hosted renderer can never call them. All provider HTTP therefore
# originates in the Rust core. `vela-settings/tests/capability_matrix_endpoints.rs`
# fails if a second crate declares one.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "charset",
] }

# The Win32 half of `private_fs`. There is no way to express "this directory is
# reachable by its owner and nobody else" on Windows through `std::fs`: the
# concept is a DACL, and setting one — with inheritance *disabled*, which is the
# whole point — means `SetNamedSecurityInfoW`. Reading it back means
# `GetNamedSecurityInfoW` plus `GetAce`, because the promise this module makes is
# a measurement and not a restatement of what was requested.
#
# `cfg(windows)` so no unix build pulls a line of this in. The feature list is
# exactly the four namespaces `private_fs::imp` imports from, plus
# `Win32_Foundation` for `LocalFree`/`CloseHandle`/`WIN32_ERROR`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
# `net` is dev-only and buys one thing: `tests/wire_auth_headers.rs` opens a
# real loopback socket to record the literal bytes Vela puts on the wire. That
# is the only vantage point from which "Auth::None sends no credential" is a
# claim about the wire rather than about a struct. It is not an HTTP client —
# `vela-settings/tests/capability_matrix_endpoints.rs` still sees exactly one.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
# The parity test deserialises this crate's content model as vela-store's and
# back, so the two models cannot drift. A dev-dependency only: the provider seam
# must not depend on persistence at runtime.
vela-store.workspace = true
