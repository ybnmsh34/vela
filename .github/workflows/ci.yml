name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Vela is offline-first and ships no telemetry. Keep the toolchains quiet too.
  DO_NOT_TRACK: '1'

jobs:
  # Gate ordering is cheap -> expensive, so a syntax error never burns a full
  # test matrix. `static` must pass before anything else runs.
  #
  # The draft guard matters here: this PR is long-running and accumulates
  # in-flight commits from parallel build agents. A red run on half-written code
  # is noise, not signal. CI stays quiet while the PR is a draft, then gates
  # every push once it is marked ready for review.
  static:
    name: Static checks
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

      - name: Rust formatting
        run: cargo fmt --all --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

  test-ts:
    name: Frontend and harness tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: GATE M Part 1 — mock capability matrix
        run: pnpm test:harness
      - name: Frontend build
        run: pnpm build

      # The mock harness is deterministic by design, so a diff in the committed
      # transcripts means real behaviour changed. This turns the GATE M evidence
      # directory into a regression test rather than a static artifact.
      - name: Mock transcripts are reproducible
        run: |
          node tests/harness/mock-provider/src/record-transcripts.ts
          if ! git diff --quiet -- docs/regression-baseline/mock-matrix; then
            echo "::error::Mock-matrix transcripts changed. Provider behaviour moved; review and commit the new evidence."
            git diff --stat -- docs/regression-baseline/mock-matrix
            exit 1
          fi

  test-rust:
    name: Rust core tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 needs webkit2gtk and friends. libsecret gives the `keyring`
      # crate a backend to link against; note this only proves it LINKS, and is
      # never evidence that OS credential storage works — that verdict belongs
      # to the desktop session. See docs/desktop-gate/.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libssl-dev libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build workspace
        run: cargo build --workspace --locked
        working-directory: src-tauri
      - name: Test workspace
        run: cargo test --workspace --locked
        working-directory: src-tauri

  # Failing this job means a secret reached the tree. It is deliberately crude
  # and deliberately cheap: the real guarantee is that keys live only in the OS
  # keychain, and this is the tripwire behind it.
  secret-tripwire:
    name: No secrets on disk
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential material
        run: |
          set -o pipefail
          # Real provider key shapes: OpenAI (sk-...), Anthropic (sk-ant-...),
          # Google (AIza...), plus committed private keys and dotenv files.
          pattern='(sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if git grep -nIE "$pattern" -- . ':!docs/**' ':!.github/workflows/ci.yml' ; then
            echo "::error::Possible credential material found in tracked files."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::A .env file is tracked. Credentials must live in the OS keychain."
            exit 1
          fi
          echo "No credential material found in tracked files."
